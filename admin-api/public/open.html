<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Opening Deal on Amazon | DealBuster</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .brand-logo {
      font-weight: 900;
      font-size: 24px;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .brand-logo .highlight {
      background: #d1ff00;
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 4px;
    }
    .loader-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 153, 0, 0.16);
      border-top-color: #ff9900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .amz-icon {
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .amz-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 0;
    }
    .btn-group {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }
    .btn-group.visible {
      display: flex;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: #ff9900;
      color: #111827;
      border: none;
      box-shadow: 0 4px 14px rgba(255, 153, 0, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #e68a00;
    }
    .btn-secondary {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-secondary:active {
      background: #334155;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-logo">
      DEAL<span class="highlight">BUSTER</span>
    </div>

    <div class="loader-wrap">
      <div class="spinner"></div>
      <div class="amz-icon" aria-hidden="true">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M77.4 72.8c-1.1 1-2.7 1.1-3.9.4-5.5-4.6-6.5-6.7-9.5-11.1-9.1 9.3-15.5 12-27.3 12-13.9 0-24.8-8.6-24.8-25.8 0-13.4 7.3-22.6 17.7-27.1 9-4 21.6-4.7 31.2-5.8v-2.2c0-4 .3-8.7-2-12.2-2.1-3.1-6-4.4-9.5-4.4-6.4 0-12.2 3.3-13.6 10.2-.3 1.5-1.4 3-2.9 3.1l-16.1-1.7c-1.4-.3-2.9-1.4-2.5-3.5C17.9 7.1 35.7 2 51.6 2c8.3 0 19.2 2.2 25.8 8.5 8.3 7.8 7.5 18.2 7.5 29.5v26.7c0 8 3.3 11.5 6.5 15.9 1.1 1.5 1.3 3.4-.1 4.6l-13.9 12.1zm-16.6-32v-5.7c-13.5 0-27.7 2.9-27.7 18.8 0 8.1 4.2 13.6 11.4 13.6 5.3 0 10-3.3 13-8.5 3.6-6.3 3.3-12.2 3.3-18.2z" fill="#111111" transform="translate(8, 6) scale(0.95)"/>
          <path d="M101.6 92.4c-11.6 8.6-28.5 13.2-43 13.2-20.3 0-38.6-7.5-52.4-20-.9-.8-.1-1.9 1-1.3 14.9 8.7 33.4 13.9 52.5 13.9 12.9 0 27.1-2.7 40.1-8.2 2-.9 3.6 1.2 1.8 2.4z" fill="#FF9900"/>
          <path d="M106.4 86.9c-1.5-1.9-9.8-.9-13.6-.5-1.1.1-1.3-.9-.3-1.6 6.6-4.7 17.5-3.3 18.8-1.8 1.3 1.6-.3 12.6-6.6 17.8-1 .8-1.9.4-1.5-.7 1.4-3.5 4.7-11.4 3.2-13.2z" fill="#FF9900"/>
        </svg>
      </div>
    </div>

    <h1 id="statusTitle">Opening in Amazon App...</h1>
    <p id="statusMsg">Taking you straight to the deal on Amazon.</p>

    <div id="btnGroup" class="btn-group">
      <a id="btnApp" href="#" class="btn btn-primary">Open in Amazon App</a>
      <a id="btnWeb" href="#" class="btn btn-secondary">Continue in Browser</a>
    </div>

    <div class="footer-note">
      DealBuster Deals • Official Amazon Associate
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var asin = params.get('asin');
      var rawUrl = params.get('url');
      var tag = params.get('tag') || 'dbitg-21';

      var targetAsin = asin;
      var targetUrl = rawUrl;

      // Try extracting ASIN from URL if asin param not supplied
      if (!targetAsin && targetUrl) {
        var m = targetUrl.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10})/i) ||
                targetUrl.match(/[?&]asin=([A-Z0-9]{10})/i) ||
                targetUrl.match(/link\.amazon\/([A-Z0-9]{10})/i) ||
                targetUrl.match(/-(B0[A-Z0-9]{8,9})(?:[/?#]|$)/i);
        if (m) targetAsin = m[1].toUpperCase();
      }

      var webUrl = '';
      var androidIntent = '';
      var iosScheme = '';

      if (targetAsin) {
        webUrl = 'https://www.amazon.in/dp/' + targetAsin + '?tag=' + encodeURIComponent(tag);
        // Standard Android Intent targeting the official Amazon India shopping app
        androidIntent = 'intent://www.amazon.in/dp/' + targetAsin + '?tag=' + encodeURIComponent(tag) +
          '#Intent;scheme=https;package=in.amazon.mShop.android.shopping;S.browser_fallback_url=' +
          encodeURIComponent(webUrl) + ';end;';
        // iOS app URI scheme
        iosScheme = 'com.amazon.mobile.shopping.web://amazon.in/dp/' + targetAsin + '?tag=' + encodeURIComponent(tag);
      } else if (targetUrl) {
        try {
          var u = new URL(targetUrl);
          u.searchParams.set('tag', tag);
          webUrl = u.toString();
        } catch(e) {
          webUrl = targetUrl + (targetUrl.indexOf('?') !== -1 ? '&' : '?') + 'tag=' + encodeURIComponent(tag);
        }
        var cleanPath = webUrl.replace(/^https?:\/\/(?:www\.)?amazon\.in\/?/i, '');
        androidIntent = 'intent://www.amazon.in/' + cleanPath +
          '#Intent;scheme=https;package=in.amazon.mShop.android.shopping;S.browser_fallback_url=' +
          encodeURIComponent(webUrl) + ';end;';
        iosScheme = 'com.amazon.mobile.shopping.web://amazon.in/' + cleanPath;
      } else {
        webUrl = 'https://www.amazon.in/?tag=' + encodeURIComponent(tag);
        androidIntent = 'intent://www.amazon.in/?tag=' + encodeURIComponent(tag) +
          '#Intent;scheme=https;package=in.amazon.mShop.android.shopping;S.browser_fallback_url=' +
          encodeURIComponent(webUrl) + ';end;';
        iosScheme = 'com.amazon.mobile.shopping.web://amazon.in/?tag=' + encodeURIComponent(tag);
      }

      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      var btnApp = document.getElementById('btnApp');
      var btnWeb = document.getElementById('btnWeb');
      var statusTitle = document.getElementById('statusTitle');
      var statusMsg = document.getElementById('statusMsg');

      if (btnWeb) btnWeb.href = webUrl;

      var didHide = false;
      function markHidden() {
        if (document.hidden) didHide = true;
      }
      document.addEventListener('visibilitychange', markHidden);
      window.addEventListener('pagehide', function() { didHide = true; });
      window.addEventListener('blur', function() { didHide = true; });

      if (isAndroid) {
        if (btnApp) btnApp.href = androidIntent;
        // Immediate forceful launch on Android
        try {
          window.location.href = androidIntent;
        } catch(e) {}
        // Fallback to web URL if WebView blocks intent:// or app did not open
        setTimeout(function() {
          if (!didHide && !document.hidden) {
            window.location.replace(webUrl);
          }
        }, 900);
      } else if (isIOS) {
        if (btnApp) btnApp.href = iosScheme;
        // Trigger iOS custom scheme
        try {
          window.location.href = iosScheme;
        } catch(e) {}
        // Fallback to web URL after 1.2s if app did not open
        setTimeout(function() {
          if (!didHide && !document.hidden) {
            window.location.replace(webUrl);
          }
        }, 1200);
      } else {
        // Desktop / Laptop: redirect directly to web URL
        if (btnApp) btnApp.href = webUrl;
        window.location.replace(webUrl);
      }

      // If user is still on page after 2.5s, reveal fallback buttons
      setTimeout(function() {
        var btnGroup = document.getElementById('btnGroup');
        if (btnGroup) btnGroup.classList.add('visible');
        if (statusTitle) statusTitle.innerText = 'Tap Below to Continue';
        if (statusMsg) statusMsg.innerText = 'If Amazon did not open automatically, tap below.';
      }, 2500);
    })();
  </script>
</body>
</html>
