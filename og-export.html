<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #f5f5f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', system-ui, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .logo {
    font-size: 120px;
    font-weight: 900;
    color: #111827;
    letter-spacing: -4px;
    text-transform: uppercase;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .logo span {
    background: #D1FF00;
    color: #111827;
    padding: 4px 24px 8px;
    display: inline-block;
    transform: rotate(-1.5deg);
    margin-left: 8px;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="logo">DEAL<span>BUSTER</span></div>
</body>
</html>
