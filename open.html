<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Opening Deal on Amazon | DealBuster</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .brand-logo {
      font-weight: 900;
      font-size: 24px;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .brand-logo .highlight {
      background: #d1ff00;
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 4px;
    }
    .loader-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 153, 0, 0.16);
      border-top-color: #ff9900;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .amz-icon {
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .amz-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 0;
    }
    .btn-group {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }
    .btn-group.visible {
      display: flex;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: #ff9900;
      color: #111827;
      border: none;
      box-shadow: 0 4px 14px rgba(255, 153, 0, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #e68a00;
    }
    .btn-secondary {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-secondary:active {
      background: #334155;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader-wrap">
      <div class="spinner"></div>
      <div class="amz-icon" aria-hidden="true">
        <svg viewBox="0 0 123 112" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
      </div>
    </div>

    <h1 id="statusTitle">Opening in Amazon App...</h1>
    <p id="statusMsg">Taking you straight to the deal on Amazon.</p>

    <div id="btnGroup" class="btn-group">
      <a id="btnApp" href="#" class="btn btn-primary">Open in Amazon App</a>
      <a id="btnWeb" href="#" class="btn btn-secondary">Continue in Browser</a>
    </div>

    <div class="footer-note">
      DealBuster Deals • Official Amazon Associate
    </div>
  </div>

  <script>
    (function() {
      var search = window.location.search || '';
      var params = new URLSearchParams(search);
      var asin = params.get('asin');
      var rawUrl = params.get('url');
      var tag = params.get('tag') || 'dbitg-21';

      if (!asin && !rawUrl && search) {
        var bareM = search.match(/^\?([A-Z0-9]{10})(?:&|$)/i);
        if (bareM) asin = bareM[1].toUpperCase();
      }

      var targetAsin = asin;
      var targetUrl = rawUrl;

      // Try extracting ASIN from URL if asin param not supplied
      if (!targetAsin && targetUrl) {
        var m = targetUrl.match(/\/(?:dp|gp\/product|gp\/aw\/d)\/([A-Z0-9]{10})/i) ||
                targetUrl.match(/[?&]asin=([A-Z0-9]{10})/i) ||
                targetUrl.match(/link\.amazon\/([A-Z0-9]{10})/i) ||
                targetUrl.match(/-(B0[A-Z0-9]{8,9})(?:[/?#]|$)/i);
        if (m) targetAsin = m[1].toUpperCase();
      }

      var webUrl = '';
      var androidIntent = '';
      var iosScheme = '';

      if (targetAsin) {
        webUrl = 'https://www.amazon.in/dp/' + targetAsin + '?tag=' + encodeURIComponent(tag);
        // Standard Android Intent targeting the official Amazon India shopping app
        androidIntent = 'intent://www.amazon.in/dp/' + targetAsin + '?tag=' + encodeURIComponent(tag) +
          '#Intent;scheme=https;package=in.amazon.mShop.android.shopping;S.browser_fallback_url=' +
          encodeURIComponent(webUrl) + ';end;';
        // iOS app URI scheme
        iosScheme = 'com.amazon.mobile.shopping.web://amazon.in/dp/' + targetAsin + '?tag=' + encodeURIComponent(tag);
      } else if (targetUrl) {
        try {
          var u = new URL(targetUrl);
          u.searchParams.set('tag', tag);
          webUrl = u.toString();
        } catch(e) {
          webUrl = targetUrl + (targetUrl.indexOf('?') !== -1 ? '&' : '?') + 'tag=' + encodeURIComponent(tag);
        }
        var cleanPath = webUrl.replace(/^https?:\/\/(?:www\.)?amazon\.in\/?/i, '');
        androidIntent = 'intent://www.amazon.in/' + cleanPath +
          '#Intent;scheme=https;package=in.amazon.mShop.android.shopping;S.browser_fallback_url=' +
          encodeURIComponent(webUrl) + ';end;';
        iosScheme = 'com.amazon.mobile.shopping.web://amazon.in/' + cleanPath;
      } else {
        webUrl = 'https://www.amazon.in/?tag=' + encodeURIComponent(tag);
        androidIntent = 'intent://www.amazon.in/?tag=' + encodeURIComponent(tag) +
          '#Intent;scheme=https;package=in.amazon.mShop.android.shopping;S.browser_fallback_url=' +
          encodeURIComponent(webUrl) + ';end;';
        iosScheme = 'com.amazon.mobile.shopping.web://amazon.in/?tag=' + encodeURIComponent(tag);
      }

      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      var btnApp = document.getElementById('btnApp');
      var btnWeb = document.getElementById('btnWeb');
      var statusTitle = document.getElementById('statusTitle');
      var statusMsg = document.getElementById('statusMsg');

      if (btnWeb) btnWeb.href = webUrl;

      var didHide = false;
      function markHidden() {
        if (document.hidden) didHide = true;
      }
      document.addEventListener('visibilitychange', markHidden);
      window.addEventListener('pagehide', function() { didHide = true; });
      window.addEventListener('blur', function() { didHide = true; });

      if (isAndroid) {
        if (btnApp) btnApp.href = androidIntent;
        // Immediate forceful launch on Android
        try {
          window.location.href = androidIntent;
        } catch(e) {}
        // Fallback to web URL if WebView blocks intent:// or app did not open
        setTimeout(function() {
          if (!didHide && !document.hidden) {
            window.location.replace(webUrl);
          }
        }, 900);
      } else if (isIOS) {
        if (btnApp) btnApp.href = iosScheme;
        // Trigger iOS custom scheme
        try {
          window.location.href = iosScheme;
        } catch(e) {}
        // Fallback to web URL after 1.2s if app did not open
        setTimeout(function() {
          if (!didHide && !document.hidden) {
            window.location.replace(webUrl);
          }
        }, 1200);
      } else {
        // Desktop / Laptop: redirect directly to web URL
        if (btnApp) btnApp.href = webUrl;
        window.location.replace(webUrl);
      }

      // If user is still on page after 2.5s, reveal fallback buttons
      setTimeout(function() {
        var btnGroup = document.getElementById('btnGroup');
        if (btnGroup) btnGroup.classList.add('visible');
        if (statusTitle) statusTitle.innerText = 'Tap Below to Continue';
        if (statusMsg) statusMsg.innerText = 'If Amazon did not open automatically, tap below.';
      }, 2500);
    })();
  </script>
</body>
</html>
