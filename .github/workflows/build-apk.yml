name: Build Test APK

on:
  push:
    paths:
      - 'dealbuster_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Structure
        run: |
          cd dealbuster_app
          # Remove the manual android folder
          rm -rf android
          # Run flutter create to generate standard Android configuration files
          flutter create --platforms=android --org com.dealbuster --project-name=dealbuster_app .

      - name: Overwrite custom Android configurations
        run: |
          # Create kotlin folder if needed (it matches package com.dealbuster.dealbuster_app)
          mkdir -p dealbuster_app/android/app/src/main/kotlin/com/dealbuster/dealbuster_app
          
          # Overwrite MainActivity.kt with the correct package name com.dealbuster.dealbuster_app
          cat << 'EOF' > dealbuster_app/android/app/src/main/kotlin/com/dealbuster/dealbuster_app/MainActivity.kt
          package com.dealbuster.dealbuster_app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # Overwrite AndroidManifest.xml to set custom label "Dealbuster" and Internet permissions
          cat << 'EOF' > dealbuster_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.dealbuster.dealbuster_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Dealbuster"
                  android:name="${applicationName}"
                  android:icon="@android:drawable/sym_def_app_icon">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # Overwrite styles.xml to avoid asset missing errors
          mkdir -p dealbuster_app/android/app/src/main/res/values
          cat << 'EOF' > dealbuster_app/android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="android:Theme.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="android:Theme.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

      - name: Install dependencies
        run: |
          cd dealbuster_app
          flutter pub get

      - name: Build Debug APK
        run: |
          cd dealbuster_app
          # Capture output to log file and output last 150 lines on failure
          flutter build apk --debug > build_log.txt 2>&1 || (tail -n 150 build_log.txt && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealbuster-test-apk
          path: dealbuster_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
